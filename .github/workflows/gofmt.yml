name: Go-fmt
on:
  push:
    branches:
    - master
    - dev
    - release/*
  # No branch filter: every pull request gets CI, whatever it targets. This fork
  # stacks PRs on each other's branches, so filtering on `master` (or on any fixed
  # list) silently leaves stacked PRs with no checks at all.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gofmt:
    name: Go fmt project
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Check gofmt
        run: test -z "$(gofmt -l .)"
