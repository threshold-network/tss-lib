name: Go Test
on:
  push:
    branches:
      # Post-merge signal only: dev and master. release/* push runs are
      # dropped; merges into dev are covered by the PR check that allowed the
      # merge, and master push keeps the post-merge signal.
      - dev
      - master
  # No branch filter: every pull request gets CI, whatever it targets. This fork
  # stacks PRs on each other's branches, so filtering on `master` (or on any fixed
  # list) silently leaves stacked PRs with no checks at all.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs. Only pull_request events cancel in-progress;
# push/dispatch runs use their own run-scoped group, so a push can never cancel
# another push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Development and CI toolchain for every job except go-minimum-build, which
# pins the documented minimum instead.
env:
  GO_VERSION: '1.26.8'

jobs:
  # Cheap early gate - fails a broken PR in ~1 min instead of ~10. go vet is
  # the repo's only vet entry point (Makefile has no vet target), so run it
  # here. The gofmt gate lives in the dedicated gofmt workflow ("Go fmt
  # project"); it is not re-run here.
  lint-fast:
    name: Vet
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    # The documented minimum (README) and the module's enforced minimum
    # (go.mod `go` directive) must agree; a toolchain rewriting the directive
    # once lowered it unnoticed.
    - name: Check go directive matches documented minimum
      run: |
        documented=$(sed -nE 's/^Go ([0-9]+\.[0-9]+(\.[0-9]+)?) or newer is required\..*/\1/p' README.md)
        declared=$(go mod edit -json | jq -r .Go)
        if [ -z "$documented" ] || [ "$documented" != "$declared" ]; then
          echo "go.mod declares go $declared but README documents '${documented:-<missing>}'" >&2
          exit 1
        fi

    - name: Vet
      run: go vet ./...

  # Unit-level keygen slice (~30 s, no ceremony). Runs in parallel with the
  # full suite so a broken keygen change fails early. The full-suite job below
  # still covers every test, so nothing is skipped.
  keygen-units:
    name: Keygen units
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Run Keygen Units
      run: >
        go test -timeout 60m -run
        'TestKGRound|TestStoreMessage|TestSSID|TestKeygen_Start|TestStartRound1|TestFinishAndSave|TestBadMessage|TestPrepareTrapdoor|TestGeneratePreParams|TestVerify'
        ./ecdsa/keygen/

  # Full suite - unchanged in coverage (the ceremonies live here and in the
  # keygen-units slice above in parallel).
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Run Tests
      run: make test_unit

    - name: Verify bidirectional legacy transcript vectors
      run: ./testdata/legacy_transcript/verify.sh

  # Live mixed-binary harness and its own tests. verify_mixed_interop.sh spins
  # up the pinned historical binary as a subprocess, so the pin (and its
  # modules) must be fetchable; the same dependency is pulled by verify.sh
  # above, so this job adds no new fetch surface.
  mixed-binary-interop:
    name: Mixed-binary interop
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        # The harness also downloads the pinned historical module's
        # dependencies, so key the module cache on its go.sum too.
        cache-dependency-path: |
          go.sum
          testdata/legacy_transcript/historical/go.sum.fixture

    - name: Vet harness
      run: |
        go vet ./testdata/legacy_transcript/oracle/
        go vet ./testdata/legacy_transcript/mixed_interop/

    - name: Run harness unit tests
      run: go test ./testdata/legacy_transcript/mixed_interop/

    - name: Run mixed-binary interop
      run: ./testdata/legacy_transcript/verify_mixed_interop.sh

  # The documented Go minimum (README and the go.mod `go` directive) is
  # normally only text-checked. Building and vetting with the minimum
  # toolchain catches code that silently uses a newer API. GOTOOLCHAIN=local
  # prevents the toolchain directive from auto-upgrading past 1.25.7.
  go-minimum-build:
    name: Go minimum build
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:

    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.7'
        cache: true

    - name: Build and vet at the minimum toolchain
      run: |
        go build ./...
        go vet ./...
