name: Go Race
on:
  # D11: weekly off-PR -race full-suite run against master and dev. Schedule
  # and workflow_dispatch become available after this file reaches the default
  # branch (master).
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  race:
    name: Go race test (${{ matrix.ref }})
    strategy:
      fail-fast: false
      matrix:
        ref: [master, dev]
    runs-on: ubuntu-latest
    # -race slows the keygen ceremony ~2-3x (estimate), so give the full
    # suite a generous budget.
    timeout-minutes: 120
    steps:

    - name: Check out code
      uses: actions/checkout@v4
      with:
        ref: ${{ matrix.ref }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.8'
        cache: true

    - name: Run Tests with Race Detector
      run: go test -timeout 60m -race ./...
